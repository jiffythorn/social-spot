<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Verdana, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="300" rx="16" fill="#f4f6f8"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2a37">Members get it on their phones - no custom app to build</text>
  <g>
    <rect x="70" y="55" width="180" height="220" rx="24" fill="#111" />
    <rect x="82" y="67" width="156" height="196" rx="14" fill="#ffffff"/>
    <rect x="82" y="67" width="156" height="34" rx="14" fill="#1f6feb"/>
    <text x="160" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Sunset Hills HOA</text>
    <rect x="94" y="112" width="132" height="30" rx="6" fill="#fff8c5" stroke="#d4a017"/>
    <text x="160" y="131" text-anchor="middle" font-size="11" fill="#333">Annual meeting Sunday</text>
    <rect x="94" y="150" width="132" height="24" rx="6" fill="#eef2f7"/>
    <text x="160" y="166" text-anchor="middle" font-size="11" fill="#333">Dues: paid ✓</text>
    <rect x="94" y="182" width="132" height="24" rx="6" fill="#eef2f7"/>
    <text x="160" y="198" text-anchor="middle" font-size="11" fill="#333">Directory • Documents</text>
    <rect x="94" y="214" width="132" height="24" rx="6" fill="#1f6feb"/>
    <text x="160" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">+ Home-screen icon</text>
  </g>
  <g font-size="14" fill="#1f2a37">
    <text x="300" y="100" font-weight="bold">On the home screen (free)</text>
    <text x="300" y="124" font-size="13" fill="#333">One tap opens dues, documents,</text>
    <text x="300" y="144" font-size="13" fill="#333">directory, announcements.</text>
    <text x="300" y="164" font-size="13" fill="#333">Your logo as the icon.</text>
    <text x="300" y="200" font-weight="bold">In the browser (everything)</text>
    <text x="300" y="224" font-size="13" fill="#333">Sign-up + approval, officer console,</text>
    <text x="300" y="244" font-size="13" fill="#333">audit history, email settings.</text>
  </g>
  <g font-size="14" fill="#1f2a37">
    <text x="620" y="100" font-weight="bold">Optional phone apps (free)</text>
    <text x="620" y="124" font-size="13" fill="#333">Tusky, Friendiqa, Raccoon…</text>
    <text x="620" y="144" font-size="13" fill="#333">cover the social feed only.</text>
    <text x="620" y="164" font-size="13" fill="#333">No build, no store fees,</text>
    <text x="620" y="184" font-size="13" fill="#333">no maintenance contract.</text>
    <rect x="620" y="205" width="220" height="40" rx="8" fill="#1a7f37"/>
    <text x="730" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">$0 app cost</text>
  </g>
</svg>
