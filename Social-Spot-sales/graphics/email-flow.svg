<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" font-family="Verdana, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="250" rx="16" fill="#fff8ec"/>
  <rect x="24" y="14" width="64" height="24" rx="12" fill="#9a6700"/>
  <text x="56" y="31" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">NEW</text>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2a37">Email that works with the mailbox you already own</text>
  <g>
    <rect x="40" y="70" width="230" height="140" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <text x="155" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2a37">Your site</text>
    <text x="155" y="125" text-anchor="middle" font-size="13" fill="#333">Approval notice,</text>
    <text x="155" y="145" text-anchor="middle" font-size="13" fill="#333">password reset</text>
    <text x="155" y="165" text-anchor="middle" font-size="13" fill="#333">created here</text>
  </g>
  <g>
    <rect x="335" y="70" width="230" height="140" rx="12" fill="#ffffff" stroke="#1f6feb" stroke-width="2"/>
    <text x="450" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2a37">Club mailbox relay</text>
    <text x="450" y="125" text-anchor="middle" font-size="13" fill="#333">Gmail / Outlook /</text>
    <text x="450" y="145" text-anchor="middle" font-size="13" fill="#333">your provider.</text>
    <text x="450" y="165" text-anchor="middle" font-size="13" fill="#333">Filled in by an officer.</text>
  </g>
  <g>
    <rect x="630" y="70" width="230" height="140" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <text x="745" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2a37">Member inbox</text>
    <text x="745" y="125" text-anchor="middle" font-size="13" fill="#333"> lands in inbox,</text>
    <text x="745" y="145" text-anchor="middle" font-size="13" fill="#333">not spam.</text>
    <text x="745" y="165" text-anchor="middle" font-size="13" fill="#333">Test button proves it.</text>
  </g>
  <g fill="#1f6feb" font-size="26" font-weight="bold">
    <text x="290" y="150">→</text>
    <text x="585" y="150">→</text>
  </g>
  <text x="450" y="232" text-anchor="middle" font-size="12" fill="#57606a">No mail server to run. No port 25. No new mailbox to pay for.</text>
</svg>
