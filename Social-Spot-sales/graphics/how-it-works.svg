<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="Verdana, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="260" rx="16" fill="#f4f6f8"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2a37">From office computer to members in three steps</text>
  <g>
    <rect x="40" y="60" width="250" height="160" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="65" cy="88" r="14" fill="#1f6feb"/>
    <text x="65" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
    <text x="90" y="93" font-size="15" font-weight="bold" fill="#1f2a37">Install once</text>
    <text x="60" y="120" font-size="13" fill="#333">Office PC + Docker.</text>
    <text x="60" y="140" font-size="13" fill="#333">One-click installer,</text>
    <text x="60" y="160" font-size="13" fill="#333">about 30 minutes,</text>
    <text x="60" y="180" font-size="13" fill="#333">no IT department needed.</text>
  </g>
  <g>
    <rect x="325" y="60" width="250" height="160" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="350" cy="88" r="14" fill="#1f6feb"/>
    <text x="350" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
    <text x="375" y="93" font-size="15" font-weight="bold" fill="#1f2a37">Invite &amp; approve</text>
    <text x="345" y="120" font-size="13" fill="#333">Members sign up with</text>
    <text x="345" y="140" font-size="13" fill="#333">unit / membership ID.</text>
    <text x="345" y="160" font-size="13" fill="#333">Officers approve in</text>
    <text x="345" y="180" font-size="13" fill="#333">one click in the console.</text>
  </g>
  <g>
    <rect x="610" y="60" width="250" height="160" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="635" cy="88" r="14" fill="#1f6feb"/>
    <text x="635" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>
    <text x="660" y="93" font-size="15" font-weight="bold" fill="#1f2a37">Run the club</text>
    <text x="630" y="120" font-size="13" fill="#333">Dues, documents,</text>
    <text x="630" y="140" font-size="13" fill="#333">directory, announcements</text>
    <text x="630" y="160" font-size="13" fill="#333">- in any browser,</text>
    <text x="630" y="180" font-size="13" fill="#333">on any phone.</text>
  </g>
  <g fill="#1f6feb" font-size="22" font-weight="bold">
    <text x="300" y="150">›</text>
    <text x="585" y="150">›</text>
  </g>
</svg>
